# Git hooks (https://lefthook.dev). Installed by `pnpm install` via the `prepare` script.
# Skip once with `LEFTHOOK=0 git commit ...` or `git commit --no-verify`.

pre-commit:
  parallel: true
  jobs:
    # Format staged files and re-stage them, so commits are always formatted.
    - name: format
      glob: "*.{ts,tsx,js,mjs,cjs,json,css,md,yml,yaml}"
      run: pnpm exec oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    - name: lint
      glob: "*.{ts,tsx,js,mjs,cjs}"
      run: pnpm exec oxlint {staged_files}

pre-push:
  parallel: true
  jobs:
    - name: typecheck
      run: pnpm typecheck
    - name: test
      run: pnpm test
